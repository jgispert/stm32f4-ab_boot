; ═════════════════════════════════════════════════════════════════════════════
;  Ejemplo: Black Pill F411 con Arduino (STM32duino) actualizable por USB.
;
;    pio run -d ../../bootloader -t upload       1. el cargador (una vez)
;    pio run -e slot_a -t upload                 2. la primera versión (borra el estado)
;    pio run -e slot_a -e slot_b                 3. versiones nuevas: las dos copias…
;    python3 ../../tools/fw_package.py --slot-a .pio/build/slot_a/firmware.bin \
;            --slot-b .pio/build/slot_b/firmware.bin                       …el .fwu
;    python3 ../../tools/fw_update.py dist/EJEMPLO-AB-<versión>.fwu --vid-pid 0483:5740
;
;  STM32duino: board_build.flash_offset mueve el enlazado y VECT_TAB_OFFSET;
;  el ldscript usa LENGTH = maximum_size − offset → maximum_size = offset + 128 KB.
; ═════════════════════════════════════════════════════════════════════════════
[env]
platform  = ststm32
board     = blackpill_f411ce
framework = arduino
lib_deps  = symlink://../../
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DEXAMPLE_VERSION=\"v0.1.0\"
upload_protocol = custom

[env:slot_a]
build_flags = ${env.build_flags} -DAB_RUN_SLOT=0
board_build.flash_offset  = 0x20000
board_upload.maximum_size = 262144
upload_command = probe-rs download --chip STM32F411CEUx --protocol swd --binary-format bin --base-address 0x08004000 ../../tools/state_blank.bin && probe-rs download --chip STM32F411CEUx --protocol swd $BUILD_DIR/${PROGNAME}.elf && probe-rs reset --chip STM32F411CEUx --protocol swd

[env:slot_b]
build_flags = ${env.build_flags} -DAB_RUN_SLOT=1
board_build.flash_offset  = 0x40000
board_upload.maximum_size = 393216
upload_command = probe-rs download --chip STM32F411CEUx --protocol swd --binary-format bin --base-address 0x08004000 ../../tools/state_blank.bin && probe-rs download --chip STM32F411CEUx --protocol swd $BUILD_DIR/${PROGNAME}.elf && probe-rs reset --chip STM32F411CEUx --protocol swd
