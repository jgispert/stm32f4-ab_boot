; ═════════════════════════════════════════════════════════════════════════════
;  Cargador A/B de ejemplo — sector 0 (16 KB) del STM32F411CE.
;  Sin framework (ni Arduino ni HAL): arranque, ldscript y registros propios.
;
;    pio run -d bootloader               compilar
;    pio run -d bootloader -t upload     grabar con el ST-Link (una vez por placa)
;
;  En un proyecto: copiar esta carpeta y cambiar lib_deps por la URL de git de
;  la librería (y build_flags si el mapa de memoria cambia).
; ═════════════════════════════════════════════════════════════════════════════
[platformio]
src_dir = src

[env:bootloader]
platform  = ststm32
board     = blackpill_f411ce
board_build.ldscript = bootloader.ld
build_unflags = -fno-rtti
build_flags =
    -DAB_BOOTLOADER
    -Os
    -std=gnu++17
    -Wall -Wextra
    -fno-exceptions -fno-rtti
lib_deps =
    symlink://../
lib_ldf_mode = chain+
extra_scripts = pre:link_flags.py
upload_protocol = custom
upload_command  = probe-rs download --chip STM32F411CEUx --protocol swd --binary-format bin --base-address 0x08004000 ../tools/state_blank.bin && probe-rs download --chip STM32F411CEUx --protocol swd $BUILD_DIR/${PROGNAME}.elf && probe-rs reset --chip STM32F411CEUx --protocol swd
